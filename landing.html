<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to FoundIt</title>
    <link rel="stylesheet" href="lost.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Specific styles for the landing page to make it full-screen */
        body, html {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevents scrolling on the splash page */
        }

        .landing-container {
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        .landing-logo {
            font-size: 4rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .landing-motto {
            font-size: 1.2rem;
            color: #64748b;
            margin-bottom: 40px;
            max-width: 500px;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.4);
            background-color: var(--primary-dark);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <h1 class="landing-logo">Found<span>It</span></h1>
        <p class="landing-motto">
            Recover what's yours. Return what's not. <br> 
            The community-driven lost and found tracking system.
        </p>
        
        <a href="lost.html" class="cta-button">Report an Item</a>
    </div>

</body>
</html>
